<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vervetDB download test</title>
<style>
    body { margin: 0; padding: 16px; background: #1f1f1f; color: #d1cfc7; font-family: system-ui, sans-serif; }
    h1 { color: white; font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 14px; line-height: 1.45; }
    button { display: block; width: 100%; margin: 0 0 10px; padding: 14px; font-size: 16px; font-weight: 700;
             text-align: left; color: #1f1f1f; background: #25c4f8; border: none; border-radius: 10px; }
    small { display: block; font-weight: 400; margin-top: 2px; }
    #log { margin-top: 16px; font-size: 13px; color: #8a877e; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Download test</h1>
<p>A temporary page to find which download method works in this browser. Tap each button, then check
   <b>⋮ → Downloads</b> for a file called <b>test-A.pdf</b>, <b>test-B.pdf</b> and so on. Note which letters appear.</p>

<button id="A">A: Download straight away<small>like now, but right after the tap</small></button>
<button id="B">B: Download after 4 seconds<small>like now: the wait for the book to be made</small></button>
<button id="C">C: Download as a "data" link<small>a different kind of link, right after the tap</small></button>
<button id="D">D: Open in a new tab<small>may show the PDF instead of saving it</small></button>
<button id="E">E: Share / Save to files<small>uses the phone's share menu</small></button>

<div id="log"></div>

<script>
// A tiny but valid one-page PDF saying "vervetDB test"
const PDF_TEXT = `%PDF-1.4
1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj
2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj
3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 300 120]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj
4 0 obj<</Length 52>>stream
BT /F1 24 Tf 30 50 Td (vervetDB test) Tj ET
endstream endobj
5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj
trailer<</Root 1 0 R>>
%%EOF`;
const pdf = () => new Blob([PDF_TEXT], { type: "application/pdf" });
const log = (text) => (document.getElementById("log").textContent += text + "\n");
log(navigator.userAgent);

function clickLink(href, name) {
    const a = document.createElement("a");
    a.href = href;
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
}
const blobUrl = () => URL.createObjectURL(pdf()); // never freed: it's a test

document.getElementById("A").onclick = () => { clickLink(blobUrl(), "test-A.pdf"); log("A tapped"); };
document.getElementById("B").onclick = () => {
    log("B: waiting 4 seconds…");
    setTimeout(() => { clickLink(blobUrl(), "test-B.pdf"); log("B done"); }, 4000);
};
document.getElementById("C").onclick = () => {
    const reader = new FileReader();
    reader.onload = () => { clickLink(reader.result, "test-C.pdf"); log("C tapped"); };
    reader.readAsDataURL(pdf());
};
document.getElementById("D").onclick = () => { window.open(blobUrl(), "_blank"); log("D tapped"); };
document.getElementById("E").onclick = async () => {
    const file = new File([pdf()], "test-E.pdf", { type: "application/pdf" });
    if (!navigator.canShare?.({ files: [file] })) { log("E: this browser can't share files"); return; }
    try { await navigator.share({ files: [file], title: "test-E.pdf" }); log("E shared"); }
    catch (e) { log("E: " + e.name); }
};
</script>
</body>
</html>
