# Runs the tests on every push. When master is pushed and the tests pass,
# builds the site and publishes it to GitHub Pages.
name: Test and deploy

on:
    push:
    pull_request:
    workflow_dispatch: # adds a "Run workflow" button on the Actions tab

# Only one run per branch at a time, so deploys never overlap
concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx vitest run
            - run: npm run build

    deploy:
        needs: test
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v5
