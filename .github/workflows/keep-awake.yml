# Free Supabase projects pause after a week without any requests, and the
# site would then fall back to its saved copy of the data. This asks the
# database for one monkey every 3 days so it stays awake.
name: Keep database awake

on:
    schedule:
        - cron: "17 6 */3 * *" # 06:17 UTC every 3rd day
    workflow_dispatch: # adds a "Run workflow" button to try it by hand

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ask Supabase for one monkey
              # The publishable key is public (it's in the website's code too)
              run: |
                  curl --fail --silent --show-error \
                    "https://demlwtsrnlkiskcntbcc.supabase.co/rest/v1/monkeys?select=id&limit=1" \
                    -H "apikey: sb_publishable_6Ts_XZUKA56m-izWdKPI_Q_dnvWnNC3"
