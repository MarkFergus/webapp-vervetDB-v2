<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- Browser tab / taskbar icon: the monkey logo in neon blue on a clear
             background. The SVG stays sharp at any size; the .ico is for
             browsers without SVG icons. "?v=3" makes browsers drop the old one. -->
        <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 24x24 32x32 48x48" />
        <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
        <link rel="manifest" href="/site.webmanifest?v=3" />
        <!-- interactive-widget: the on-screen keyboard covers the page instead of
             shrinking it, so sizes set from the screen height stay put -->
        <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="A web interface for the VMF monkey database"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,200..1000;1,200..1000&family=Russo+One&family=Syne:wght@400..800&display=swap"
            rel="stylesheet"
        />
        <title>VervetDB</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
